<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Simular Reembolso — ClickBus</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main class="page">
    <section class="card">
      <header class="card__header">
        <h1>Simule seu reembolso</h1>
        <p class="trecho">Veja quanto volta antes de cancelar a passagem</p>
      </header>

      <form id="form-simulador" class="form-simulador">
        <div class="field">
          <label for="valor-passagem">Valor da passagem</label>
          <input
            type="number"
            id="valor-passagem"
            min="0"
            step="0.01"
            placeholder="Ex: 156.40"
            required
          />
        </div>

        <div class="field">
          <label for="data-viagem">Data da viagem</label>
          <input type="date" id="data-viagem" required />
        </div>

        <button type="submit" class="btn-primary">Calcular reembolso</button>
      </form>

      <div id="resultado" class="resultado" hidden></div>

      <a href="index.html" class="nav-link">← Ver status de um reembolso</a>
    </section>
  </main>

  <script src="utils.js"></script>
  <script src="api.js"></script>
  <script src="simulador.js"></script>
</body>
</html>
